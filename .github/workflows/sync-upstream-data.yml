name: Propose upstream data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-primer-data
  cancel-in-progress: false

jobs:
  propose:
    if: vars.MTG_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run data:upstream
      - run: npm exec -- tsx --test tests/upstream-data.test.ts
      - run: npm run typecheck
      - name: Check whether upstream data changed
        id: diff
        run: |
          if ! git diff --quiet -- src/content/guides src/content/global scripts/state/upstream.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if test -n "$(git ls-files --others --exclude-standard src/content/guides)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        if: steps.diff.outputs.changed == 'true'
      - name: Propose data without merging upstream code
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/upstream-data
          title: "Aggiorna dati MTG Primer originali"
          commit-message: "data: import upstream guides preserving local customizations"
          body-path: .scryfall-cache/reports/upstream.md
          add-paths: |
            src/content/guides/**
            src/content/global/pages.ts
            src/content/global/preset.ts
            scripts/state/upstream.json
      - name: Preserve upstream report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-data-report
          path: .scryfall-cache/reports/
          retention-days: 30
