name: Update Italian card images

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - "src/content/guides/**"
      - "src/content/global/**"
      - "scripts/generate-italian-card-images.ts"
      - "scripts/lib/**"
      - "src/lib/config.ts"
      - ".github/workflows/update-italian-card-images.yml"

permissions:
  contents: read

concurrency:
  group: italian-card-images
  cancel-in-progress: false

jobs:
  update:
    # Intentionally dormant until the owner enables this variable after review.
    if: vars.MTG_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: day
        run: echo "value=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .scryfall-cache/bulk-metadata.json
            .scryfall-cache/all-cards-*.jsonl.gz
            .scryfall-cache/printing-index.json
          key: scryfall-${{ runner.os }}-${{ steps.day.outputs.value }}-${{ github.run_id }}
          restore-keys: scryfall-${{ runner.os }}-
      - run: npm run images:italian
      - run: npm run test:images
      - run: npm run typecheck
      - name: Check whether generated files changed
        id: diff
        run: |
          if ! git diff --quiet -- src/content/card-images scripts/state/italian-images.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        if: steps.diff.outputs.changed == 'true'
      - name: Propose generated images
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/italian-card-images
          title: "Aggiorna immagini italiane Scryfall"
          commit-message: "data: update exact Italian card image associations"
          body-path: .scryfall-cache/reports/images.md
          add-paths: |
            src/content/card-images/italian.json
            src/content/card-images/coverage.json
            scripts/state/italian-images.json
      - name: Preserve coverage and errors
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: italian-image-reports
          path: .scryfall-cache/reports/
          retention-days: 30
